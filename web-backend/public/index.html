<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电视直播频道管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #f39c12;
            color: white;
            margin-right: 10px;
        }

        .btn-edit:hover {
            background: #d68910;
        }

        .channels-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .channels-table th,
        .channels-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .channels-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .channels-table tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-http {
            background: #3498db;
            color: white;
        }

        .badge-udp {
            background: #2ecc71;
            color: white;
        }

        .badge-rtp {
            background: #9b59b6;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 电视直播频道管理</h1>
            <p>管理您的电视直播频道列表</p>
        </div>

        <div class="content">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openAddModal()">➕ 添加频道</button>
            </div>

            <table class="channels-table" id="channelsTable">
                <thead>
                    <tr>
                        <th>频道名称</th>
                        <th>流地址</th>
                        <th>流类型</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="channelsBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="channelModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">添加频道</div>
            <form id="channelForm">
                <input type="hidden" id="channelId">
                <div class="form-group">
                    <label>频道名称</label>
                    <input type="text" id="channelName" placeholder="例如：中央一台" required>
                </div>
                <div class="form-group">
                    <label>流地址</label>
                    <input type="text" id="streamUrl" placeholder="例如：udp://@239.0.0.1:1234" required>
                </div>
                <div class="form-group">
                    <label>流类型</label>
                    <select id="streamType">
                        <option value="HTTP">HTTP</option>
                        <option value="UDP">UDP</option>
                        <option value="RTP">RTP</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let channels = [];

        async function loadChannels() {
            try {
                const response = await fetch('/api/channels');
                channels = await response.json();
                renderChannels();
            } catch (error) {
                console.error('加载频道失败:', error);
                alert('加载频道失败，请刷新页面重试');
            }
        }

        function renderChannels() {
            const tbody = document.getElementById('channelsBody');
            
            if (channels.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4">
                            <div class="empty-state">
                                <h3>暂无频道</h3>
                                <p>点击上方按钮添加第一个频道</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = channels.map(channel => `
                <tr>
                    <td><strong>${channel.name}</strong></td>
                    <td><code>${channel.streamUrl}</code></td>
                    <td><span class="badge badge-${channel.streamType.toLowerCase()}">${channel.streamType}</span></td>
                    <td>
                        <button class="btn btn-edit" onclick="openEditModal('${channel.id}')">编辑</button>
                        <button class="btn btn-danger" onclick="deleteChannel('${channel.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = '添加频道';
            document.getElementById('channelId').value = '';
            document.getElementById('channelName').value = '';
            document.getElementById('streamUrl').value = '';
            document.getElementById('streamType').value = 'HTTP';
            document.getElementById('channelModal').classList.add('active');
        }

        function openEditModal(id) {
            const channel = channels.find(c => c.id == id);
            if (!channel) return;

            document.getElementById('modalTitle').textContent = '编辑频道';
            document.getElementById('channelId').value = channel.id;
            document.getElementById('channelName').value = channel.name;
            document.getElementById('streamUrl').value = channel.streamUrl;
            document.getElementById('streamType').value = channel.streamType;
            document.getElementById('channelModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('channelModal').classList.remove('active');
        }

        async function saveChannel(event) {
            event.preventDefault();

            const id = document.getElementById('channelId').value;
            const channelData = {
                name: document.getElementById('channelName').value,
                streamUrl: document.getElementById('streamUrl').value,
                streamType: document.getElementById('streamType').value,
                logoUrl: null,
                isFavorite: false
            };

            try {
                if (id) {
                    await fetch(`/api/channels/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(channelData)
                    });
                } else {
                    await fetch('/api/channels', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(channelData)
                    });
                }

                closeModal();
                loadChannels();
            } catch (error) {
                console.error('保存频道失败:', error);
                alert('保存频道失败，请重试');
            }
        }

        async function deleteChannel(id) {
            if (!confirm('确定要删除这个频道吗？')) return;

            try {
                await fetch(`/api/channels/${id}`, {
                    method: 'DELETE'
                });
                loadChannels();
            } catch (error) {
                console.error('删除频道失败:', error);
                alert('删除频道失败，请重试');
            }
        }

        document.getElementById('channelForm').addEventListener('submit', saveChannel);
        loadChannels();
    </script>
</body>
</html>
